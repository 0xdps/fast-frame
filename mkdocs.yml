site_name: FastFrame
site_description: A batteries-included Python web framework built on FastAPI.
site_url: https://fast-frame.readthedocs.io/
repo_url: https://github.com/0xdps/fast-frame
repo_name: 0xdps/fast-frame
edit_uri: edit/trunk/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Start:
      - Tutorial: tutorial.md
      - API: api-layer.md
      - CLI: cli.md
      - Settings: settings.md
  - Models:
      - Fields: models-fields-design.md
      - Queries: orm-features.md
  - Auth and admin:
      - Auth: auth.md
      - Permissions: permissions.md
      - Admin: admin-setup.md
      - Deploying admin: admin-deployment.md
      - REST API: rest-api.md
      - Security: ADMIN_SECURITY_WARNING.md
  - Reference:
      - Apps: app-contract.md
      - Public API: public-api-v0.1.md
      - Shell: shell.md

exclude_docs: |
  README.md
  adr/**
  vision-and-thesis.md
  design-principles.md
  architecture.md
  non-goals.md
  roadmap.md
  mvp-v0.1.md
  repository-layout.md
  development.md
  session-lifecycle.md
  admin-customization.md

plugins:
  - search

strict: true
