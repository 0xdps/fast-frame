site_name: FastFrame
site_description: A batteries-included Python web framework built on FastAPI.
site_url: https://fastframe.readthedocs.io/
repo_url: https://github.com/0xdps/fast-frame
repo_name: 0xdps/fast-frame
edit_uri: edit/trunk/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: README.md
  - Project:
      - Vision and thesis: vision-and-thesis.md
      - Design principles: design-principles.md
      - Architecture: architecture.md
      - Non-goals: non-goals.md
      - Roadmap: roadmap.md
      - MVP v0.1: mvp-v0.1.md
      - Repository layout: repository-layout.md
  - Using FastFrame:
      - App contract: app-contract.md
      - Settings: settings.md
      - CLI: cli.md
      - Shell: shell.md
      - Session lifecycle: session-lifecycle.md
      - Public API: public-api-v0.1.md
      - Development: development.md
  - Models:
      - ORM features: orm-features.md
      - Models and fields: models-fields-design.md
  - Auth and admin:
      - Auth: auth.md
      - Permissions: permissions.md
      - REST API: rest-api.md
      - Admin setup: admin-setup.md
      - Admin deployment: admin-deployment.md
      - Admin customization: admin-customization.md
      - Admin security: ADMIN_SECURITY_WARNING.md
  - Decisions:
      - Index: adr/README.md
      - "0001: Record decisions": adr/0001-record-architecture-decisions.md
      - "0002: FastAPI as HTTP": adr/0002-fastapi-as-http-layer.md
      - "0003: Thin ORM": adr/0003-thin-orm-with-sqlalchemy-escape-hatch.md
      - "0004: Dual CLI": adr/0004-dual-cli-fastframe-and-manage-py.md
      - "0005: Installed apps": adr/0005-extensibility-via-installed-apps.md
      - "0006: Sync SQLAlchemy": adr/0006-sync-sqlalchemy-for-v0-1.md
      - "0007: SSR admin (superseded)": adr/0007-ssr-for-admin-v0-3.md
      - "0008: REST + React admin": adr/0008-rest-api-react-admin.md

exclude_docs: |
  changelog.md
  contributing.md

plugins:
  - search

strict: true
