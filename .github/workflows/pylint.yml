name: PyLint and Pytest

on:
  push:
    branches: [trunk, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pylint
        run: |
          set +e
          pylint src/fastframe --fail-on=E,F --output-format=text > pylint.txt
          code=$?
          cat pylint.txt
          # 0 = clean. 4 = warnings, 6 = warnings plus a non-zero score.
          # Neither is an error. 2 = a real error or fatal.
          if [ "$code" -eq 2 ] || grep -E ': [EF][0-9]{4}:' pylint.txt; then
            exit 2
          fi
      - name: Pytest
        run: pytest
