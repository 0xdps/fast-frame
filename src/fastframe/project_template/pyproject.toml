[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["{{PROJECT_NAME}}*", "config*"]

[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "FastFrame project"
requires-python = ">=3.11"
dependencies = [
    "fast-frame>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
