<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastFrame Admin</title>
    <script>
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem("frame.theme");
        root.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        if (localStorage.getItem("frame.density") === "1") root.dataset.density = "compact";
        if (localStorage.getItem("frame.sidebar") === "1") root.dataset.sidebar = "folded";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
