repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: scripts/pylint-check.sh
        language: system
        pass_filenames: false
        files: ^src/fastframe/.*\.py$
