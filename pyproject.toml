[project]
name = "fastframe"
version = "0.1.0"
description = "A batteries-included Python web framework built on FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FastFrame contributors" }]
keywords = ["fastapi", "web", "framework", "django", "sqlalchemy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/0xdps/fast-frame"
Documentation = "https://github.com/0xdps/fast-frame/tree/trunk/docs"
Repository = "https://github.com/0xdps/fast-frame"
Issues = "https://github.com/0xdps/fast-frame/issues"

[project.scripts]
fastframe = "fastframe.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastframe"]

[tool.hatch.build.targets.sdist]
include = ["src/fastframe", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "src/fastframe/project_template/app/*.tpl",
    "tests/fixtures/miniproject/*/migrations/versions/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fastframe/project_template/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fastframe"]
